<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interfaz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    :root {
        --bg-color: #070b12;
        --sidebar-bg: #0c1322;
        --accent-color: #1a4a75;
        --accent-glow: #76c7ff;
        --text-main: #d0e7ff;
        --text-muted: #739ac4;
        --border-color: #1c3556;
        --font-family: 'VT323', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* COLUMNA IZQUIERDA: ESTÉTICA ÁRTICA */
    #left-panel {
      width: 220px;
      background: linear-gradient(180deg, #10192d 0%, #060912 100%);
      border-right: 4px solid #1c3556;
      box-shadow: inset -5px 0 20px rgba(0, 150, 255, 0.1), 8px 0 25px rgba(0, 0, 0, 0.8);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 5;
      height: 100vh;
      overflow-y: auto;
    }

    .character-portrait-frame {
      width: 90px;
      height: 110px;
      border: 2px solid #36648b;
      outline: 2px solid #070b12;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 15px rgba(118, 199, 255, 0.15);
      background: #000;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .character-portrait-frame:hover {
      transform: scale(1.03);
      border-color: var(--accent-glow);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(118, 199, 255, 0.4);
    }

    .character-portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character-name {
      font-family: var(--font-family);
      font-size: 1.6rem;
      letter-spacing: 1px;
      color: #e0f0ff;
      text-align: center;
      text-shadow: 0 0 8px rgba(118, 199, 255, 0.3);
      margin-bottom: 6px;
      word-break: break-word;
    }

    .character-profession {
      font-family: var(--font-family);
      font-size: 1.1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 12px;
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    /* BOTÓN DE INVENTARIO Y REINICIAR EN LA BARRA IZQUIERDA */
    .inventory-btn {
      font-family: var(--font-family);
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--text-main);
      background: var(--accent-color);
      border: 1px solid var(--accent-glow);
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 3px;
      margin-bottom: 15px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 10px rgba(118, 199, 255, 0.2);
      transition: all 0.2s ease-in-out;
    }

    .inventory-btn:hover {
      background: var(--accent-glow);
      color: #070b12;
      box-shadow: 0 0 15px rgba(118, 199, 255, 0.5);
    }

    .reset-btn {
      background: #36151f;
      border: 1px solid #ff7676;
      color: #ffcccc;
      box-shadow: 0 0 10px rgba(255, 118, 118, 0.2);
    }

    .reset-btn:hover {
      background: #ff7676;
      color: #070b12;
      box-shadow: 0 0 15px rgba(255, 118, 118, 0.5);
    }

    .sidebar-decoration-container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
      min-height: 120px;
    }

    .sidebar-gif {
      width: 100%;
      max-width: 160px;
      height: auto;
      object-fit: contain;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(0, 150, 255, 0.1);
      opacity: 0.85;
    }

    /* COLUMNA DERECHA: IFRAME CONTENEDOR DE LOCALIZACIONES */
    #right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #030508;
    }

    #right-panel-iframe {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #030508;
    }

    /* MODAL DE FOTO EN PANTALLA COMPLETA */
    #fullscreen-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(3, 5, 8, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    #fullscreen-modal img {
      max-width: 85vw;
      max-height: 85vh;
      object-fit: contain;
      border: 3px solid var(--accent-glow);
      box-shadow: 0 0 35px rgba(118, 199, 255, 0.3);
      border-radius: 4px;
      background: #070b12;
      padding: 10px;
    }

    /* POPUP BONITO DE REINICIO */
    #reset-confirm-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(3, 5, 8, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30000;
      backdrop-filter: blur(6px);
    }

    .reset-dialog-box {
      background: var(--sidebar-bg);
      border: 2px solid var(--accent-glow);
      border-radius: 6px;
      padding: 30px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 30px rgba(118, 199, 255, 0.3);
    }

    .reset-dialog-box h2 {
      font-family: var(--font-family);
      font-size: 2rem;
      color: var(--accent-glow);
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .reset-dialog-box p {
      font-family: var(--font-family);
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .reset-dialog-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .dialog-btn {
      font-family: var(--font-family);
      font-size: 1.3rem;
      letter-spacing: 1px;
      padding: 8px 25px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease-in-out;
    }

    .btn-yes {
      background: #36151f;
      border: 1px solid #ff7676;
      color: #ffcccc;
    }

    .btn-yes:hover {
      background: #ff7676;
      color: #070b12;
      box-shadow: 0 0 15px rgba(255, 118, 118, 0.5);
    }

    .btn-no {
      background: var(--accent-color);
      border: 1px solid var(--accent-glow);
      color: var(--text-main);
    }

    .btn-no:hover {
      background: var(--accent-glow);
      color: #070b12;
      box-shadow: 0 0 15px rgba(118, 199, 255, 0.5);
    }

    /* CAPA PANTALLA DE INICIO / OVERLAY */
    #start-screen-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(5, 9, 16, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      transition: opacity 0.5s ease;
    }

    .start-btn {
      font-family: var(--font-family);
      font-size: 2.5rem;
      letter-spacing: 3px;
      color: var(--text-main);
      background: var(--accent-color);
      border: 2px solid var(--accent-glow);
      padding: 15px 45px;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(118, 199, 255, 0.3);
      transition: all 0.2s ease-in-out;
    }

    .start-btn:hover {
      background: var(--accent-glow);
      color: #070b12;
      box-shadow: 0 0 30px rgba(118, 199, 255, 0.6);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="start-screen-overlay">
    <button class="start-btn" onclick="iniciarExpedicion()">INICIAR</button>
  </div>

  <div id="left-panel">
    <div class="character-portrait-frame" onclick="reproducirClickYAccion('foto')">
      <img id="char-photo" src="" alt="Foto Jugador" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23739ac4\'><path d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z\'/></svg>'">
    </div>
    
    <div class="character-name" id="char-name">Cargando...</div>
    <div class="character-profession" id="char-profession">---</div>

    <button class="inventory-btn" onclick="reproducirClickYAccion('inventario')">INVENTARIO</button>
    <button class="inventory-btn reset-btn" onclick="reproducirClickYAccion('reiniciar')">REINICIAR</button>

    <div class="sidebar-decoration-container">
      <img src="images/facedetected.gif" alt="Face Detected" class="sidebar-gif">
    </div>
  </div>

  <div id="right-panel">
    <iframe id="right-panel-iframe" src="mapa.html" name="localizacionFrame"></iframe>
  </div>

  <div id="fullscreen-modal" onclick="cerrarFullscreen()">
    <img id="fullscreen-img" src="" alt="Imagen Ampliada">
  </div>

  <!-- POPUP DE CONFIRMACIÓN DE REINICIO -->
  <div id="reset-confirm-modal">
    <div class="reset-dialog-box">
      <h2>SISTEMA DE ALERTA</h2>
      <p>¿Estás seguro de que deseas reiniciar y borrar toda la memoria y selecciones anteriores?</p>
      <div class="reset-dialog-buttons">
        <button class="dialog-btn btn-yes" onclick="ejecutarReiniciar(true)">SÍ</button>
        <button class="dialog-btn btn-no" onclick="ejecutarReiniciar(false)">NO</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyxoSM32MKedAamrgglimkF6W9-q0MrB-N1BmLL5WH6pKvLO2mDcz4aeCxCRm78OZaFcA/exec';
    
    // Obtener el jugador desde la URL o usar uno por defecto si se accede de forma directa
    const urlParams = new URLSearchParams(window.location.search);
    let jugadorActual = urlParams.get('jugador') || localStorage.getItem('jugador_activo_global') || 'jugador1';

    let todosLosJugadores = [];
    let miJugadorData = null;

    window.onload = function() {
      sincronizarConGoogleSheets();
      setInterval(sincronizarConGoogleSheets, 3000);
    };

    // Función para reproducir el sonido de clic y ejecutar la acción correspondiente
    function reproducirClickYAccion(tipo) {
      const audioClick = new Audio('audio/click.mp3');
      audioClick.play().catch(e => console.log("Audio click prevent:", e));

      if (tipo === 'inventario') {
        window.open('jugador1.html', '_blank');
      } else if (tipo === 'foto') {
        abrirFotoPersonaje();
      } else if (tipo === 'reiniciar') {
        document.getElementById('reset-confirm-modal').style.display = 'flex';
      }
    }

    function ejecutarReiniciar(confirmado) {
      const audioClick = new Audio('audio/click.mp3');
      audioClick.play().catch(e => console.log("Audio click prevent:", e));
      
      if (confirmado) {
        localStorage.clear();
        window.location.href = 'index.html'; // O recargar la página principal de selección
      } else {
        document.getElementById('reset-confirm-modal').style.display = 'none';
      }
    }

    // Función que se ejecuta al hacer clic en el botón INICIAR
    function iniciarExpedicion() {
      // Reproducir audio de ambiente
      const audioAmbiente = new Audio('audio/ambiente.mp3');
      audioAmbiente.loop = true;
      audioAmbiente.volume = 0.5; // Ajusta el volumen aquí si lo deseas (0.0 a 1.0)
      audioAmbiente.play().catch(e => console.log("Audio ambiente prevent:", e));

      // Ocultar la pantalla de inicio con transición suave
      const overlay = document.getElementById('start-screen-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 500);
    }

    function sincronizarConGoogleSheets() {
      const urlConCache = APPS_SCRIPT_URL + '?t=' + new Date().getTime();

      fetch(urlConCache)
        .then(res => res.json())
        .then(data => {
          if (!Array.isArray(data)) return;

          todosLosJugadores = data;
          miJugadorData = data.find(p => String(p.jugador_id || '').toLowerCase().trim() === jugadorActual.toLowerCase().trim()) || data[0];

          if (miJugadorData) {
            renderizarPerfil();
          }
        })
        .catch(err => console.error("Error Fetch:", err));
    }

    function renderizarPerfil() {
      const nombreFinal = miJugadorData.nombre || miJugadorData.jugador_id || jugadorActual;
      
      // Guardar el nombre real normalizado de forma global para las páginas internas
      localStorage.setItem('jugador_activo_global', nombreFinal);

      document.getElementById('char-name').innerText = nombreFinal;
      document.getElementById('char-profession').innerText = miJugadorData.profesion || 'Investigador';
      
      if (miJugadorData.foto) {
        document.getElementById('char-photo').src = miJugadorData.foto;
      }

      // Sincroniza el iframe de la derecha pasando el parámetro del jugador si aún no lo tiene
      const iframeMapa = document.getElementById('right-panel-iframe');
      if (!iframeMapa.src.includes(`jugador=`)) {
        iframeMapa.src = `mapa.html?jugador=${encodeURIComponent(nombreFinal)}`;
      }
    }

    function abrirFotoPersonaje() {
      const srcFoto = document.getElementById('char-photo').src;
      const modal = document.getElementById('fullscreen-modal');
      document.getElementById('fullscreen-img').src = srcFoto;
      modal.style.display = 'flex';
    }

    function cerrarFullscreen() {
      document.getElementById('fullscreen-modal').style.display = 'none';
    }
  </script>
</body>
</html>
