<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outpost 31</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #03060c;
            --text-color: #b0e0e6;
            --accent-color: #1e90ff;
            --accent-glow: #00ffff;
            --dark-accent: #091626;
            --font-title: 'VT323', monospace;
            --font-text: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #08162b 0%, #020408 100%);
            color: var(--text-color);
            font-family: var(--font-text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* INTRODUCCIÓN ESTILO JUEGO */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 1.2s ease;
        }

        #studio-text {
            font-family: var(--font-title);
            color: var(--accent-glow);
            font-size: 3rem;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            position: absolute;
            text-align: center;
        }

        #zoom-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        #zoom-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scale(0.1);
            opacity: 0;
            transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.5s ease-in;
            filter: hue-rotate(0deg) saturate(1) contrast(1);
        }

        #zoom-container.active #zoom-image {
            transform: scale(1);
            opacity: 1;
        }

        .continue-btn {
            position: absolute;
            bottom: 15%;
            font-family: var(--font-title);
            background: rgba(9, 21, 36, 0.9);
            color: var(--accent-glow);
            border: 2px solid var(--accent-color);
            padding: 12px 40px;
            font-size: 1.5rem;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 2px;
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.4);
            display: none;
            z-index: 10000;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background: var(--accent-color);
            color: #03060c;
            box-shadow: 0 0 30px var(--accent-glow);
            transform: scale(1.05);
        }

        /* PANTALLA PRINCIPAL SELECCIÓN */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .container.visible {
            opacity: 1;
        }

        h1 {
            font-family: var(--font-title);
            color: var(--accent-glow);
            text-align: center;
            font-size: 2.8rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            font-style: italic;
            color: #5c82a6;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 25px;
        }

        .char-card {
            background: var(--dark-accent);
            border: 2px solid #10315a;
            border-radius: 2px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .char-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            background: #091524;
        }

        .char-photo {
            width: 85px;
            height: 105px;
            border: 2px solid var(--accent-color);
            object-fit: cover;
            filter: hue-rotate(0deg) saturate(1) contrast(1);
            margin-right: 15px;
            background: #000;
            border-radius: 2px;
        }

        .char-info h3 {
            margin: 0;
            font-family: var(--font-title);
            color: var(--accent-glow);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .char-info p {
            margin: 6px 0 0;
            font-size: 0.85rem;
            color: #5c82a6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* MODAL DE ACCESO / CLAVE */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 5, 10, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .password-box {
            background: var(--dark-accent);
            border: 2px solid var(--accent-color);
            border-radius: 2px;
            padding: 35px 30px;
            text-align: center;
            width: 360px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
        }

        .password-box h3 {
            font-family: var(--font-title);
            color: var(--accent-glow);
            margin-top: 0;
            letter-spacing: 1px;
            font-size: 1.8rem;
        }

        .password-box p {
            color: #5c82a6;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .password-box input {
            background: #03060c;
            border: 1px solid var(--accent-color);
            color: var(--accent-glow);
            padding: 10px;
            margin-bottom: 20px;
            width: 85%;
            text-align: center;
            font-family: inherit;
            font-size: 1.1rem;
            letter-spacing: 2px;
            outline: none;
            border-radius: 2px;
        }

        .btn-entrar {
            background: var(--accent-color);
            color: #03060c;
            border: none;
            padding: 10px 30px;
            cursor: pointer;
            font-family: var(--font-title);
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 1.2rem;
            border-radius: 2px;
            transition: background 0.2s;
        }

        .btn-entrar:hover {
            background: var(--accent-glow);
        }

        .close-btn {
            position: absolute; 
            top: 10px; 
            right: 15px;
            cursor: pointer; 
            font-size: 1.5rem; 
            font-weight: bold;
            color: var(--accent-glow);
            transition: 0.2s;
            font-family: Arial, sans-serif;
        }

        .close-btn:hover { color: #fff; }

        .error-msg { 
            color: #ff6b6b; 
            font-size: 0.75rem; 
            margin-top: 10px; 
            display: none; 
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- CAPA DE INTRODUCCIÓN ESTILO VIDEOJUEGO -->
    <div id="intro-overlay">
        <div id="studio-text">UTRERA PRODUCTIONS</div>
        <div id="zoom-container">
            <img id="zoom-image" src="images/intro.gif" alt="Outpost 31 Intro">
        </div>
        <button class="continue-btn" id="continueBtn" onclick="startMainMenu()">CONTINUAR</button>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE SELECCIÓN DE JUGADORES -->
    <div class="container" id="main-content">
        <h1>Selección de Identidad</h1>
        <div class="subtitle">Elija su registro personal para acceder al puesto avanzado...</div>
        
        <div class="character-grid" id="character-grid">
            <!-- Generado dinámicamente -->
        </div>
    </div>

    <!-- MODAL DE ACCESO RESTRINGIDO -->
    <div class="modal-overlay" id="login-modal">
        <div class="password-box">
            <span class="close-btn" onclick="closeModal('login-modal')">X</span>
            <h3>Acceso Restringido</h3>
            <p id="login-instruction">Introduce tu clave de seguridad:</p>
            <input type="text" id="login-input" placeholder="Clave..." autocomplete="off">
            <br>
            <button class="btn-entrar" onclick="checkPlayerLogin()">Entrar</button>
            <p class="error-msg" id="login-error">Clave incorrecta</p>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE LOS 8 JUGADORES
        const players = [
            { id: 1, name: "Harry Livingstone", login: "hola", photo: "images/jugador1.jpg", job: "Científico", fileId: "interfaz1" },
            { id: 2, name: "Jason McGee", login: "hola", photo: "images/jugador2.jpg", job: "Coronel", fileId: "interfaz2" },
            { id: 3, name: "Doc Murray", login: "hola", photo: "images/jugador3.jpg", job: "Doctor", fileId: "interfaz3" },
            { id: 4, name: "Donnie Sullivan", login: "hola", photo: "images/jugador4.jpg", job: "Cuidador de perros", fileId: "interfaz4" },
            { id: 5, name: "Charles Dixon", login: "hola", photo: "images/jugador5.jpg", job: "Coronel", fileId: "interfaz5" },
            { id: 6, name: "Alex Foster", login: "hola", photo: "images/jugador6.jpg", job: "Ingeniero", fileId: "interfaz6" },
            { id: 7, name: "Steven Hawson", login: "hola", photo: "images/jugador7.jpg", job: "Científico", fileId: "interfaz7" },
            { id: 8, name: "Leo  Vásquez", login: "hola", photo: "images/jugador8.jpg", job: "Soldado", fileId: "interfaz8" }
        ];

        let selectedPlayer = null;

        // EFECTOS DE AUDIO GENERALES
        function reproducirClick() {
            const clickAudio = new Audio('audio/click.mp3');
            clickAudio.play().catch(e => console.log("Audio prevent:", e));
        }

        // SECUENCIA DE ANIMACIÓN INICIAL
        window.addEventListener('DOMContentLoaded', () => {
            const studioText = document.getElementById('studio-text');
            const zoomContainer = document.getElementById('zoom-container');
            const continueBtn = document.getElementById('continueBtn');

            setTimeout(() => {
                studioText.style.opacity = '1';
            }, 600);

            setTimeout(() => {
                studioText.style.opacity = '0';
                setTimeout(() => {
                    studioText.style.display = 'none';
                    zoomContainer.style.display = 'flex';
                    setTimeout(() => {
                        zoomContainer.classList.add('active');
                    }, 50);
                }, 1000);
            }, 3200);

            setTimeout(() => {
                continueBtn.style.display = 'block';
            }, 7000);

            renderizarTarjetas();
        });

        function startMainMenu() {
            reproducirClick();

            const introAudio = new Audio('audio/intro.mp3');
            introAudio.play().catch(e => console.log("Audio intro prevent:", e));

            const introOverlay = document.getElementById('intro-overlay');
            introOverlay.style.opacity = '0';
            
            setTimeout(() => {
                introOverlay.style.display = 'none';
                document.getElementById('main-content').classList.add('visible');
            }, 1200);
        }

        function renderizarTarjetas() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';

            players.forEach(p => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.onclick = () => {
                    reproducirClick();
                    openLogin(p);
                };
                card.innerHTML = `
                    <img src="${p.photo}" class="char-photo" alt="${p.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'%2300ffff\\'><path d=\\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z\\'/></svg>'">
                    <div class="char-info">
                        <h3>${p.name}</h3>
                        <p>${p.job}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openLogin(player) {
            selectedPlayer = player;
            document.getElementById('login-modal').classList.add('active');
            document.getElementById('login-input').value = '';
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('login-input').focus();
        }

        function checkPlayerLogin() {
            const val = document.getElementById('login-input').value.trim().toLowerCase();
            
            if (val === selectedPlayer.login.toLowerCase()) {
                const correctAudio = new Audio('audio/correct.mp3');
                correctAudio.play().catch(e => console.log("Error audio correct:", e));
                
                // GUARDAR EN MEMORIA EL JUGADOR ACTIVO
                localStorage.setItem('jugador_actual', selectedPlayer.id);

                // REDIRIGIR A LA INTERFAZ CORRESPONDIENTE
                setTimeout(() => {
                    window.location.href = selectedPlayer.fileId + '.html';
                }, 1200);

            } else {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Error audio nope:", e));
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function closeModal(id) {
            reproducirClick();
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('login-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPlayerLogin();
        });
    </script>
</body>
</html>
